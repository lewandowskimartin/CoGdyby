risks:
  - name: "Powódź na Odrze"
    rating: "Bardzo wysokie"
    atHome: "Opole i Kędzierzyn-Koźle leżą nad Odrą, a Nysa i Głuchołazy nad Nysą Kłodzką i Białą Głuchołaską. W 1997 i 2024 roku woda weszła tu do tysięcy domów."
    firstAction: "Sprawdzaj ostrzeżenia hydrologiczne IMGW dla swojego powiatu i ustalcie w rodzinie, co i kiedy przenosicie na piętro."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Opolszczyzna"
  - name: "Wichury nad Opolszczyzną"
    rating: "Wysokie"
    atHome: "Silny wiatr przewraca drzewa przy drogach i zrywa przewody, a wsie zostają bez prądu."
    firstAction: "Po ostrzeżeniu IMGW zabezpiecz rzeczy na podwórku i przygotuj latarki na wieczór bez prądu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Opolszczyzna"
  - name: "Długie przerwy w prądzie"
    rating: "Wysokie"
    atHome: "Podczas powodzi i po nawałnicach prąd w części regionu potrafi zniknąć na kilka dni."
    firstAction: "Latarkę, power bank i radio trzymaj w stałym miejscu. Pogotowie energetyczne to numer 991."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie i wyłączenia, Tauron, Opolszczyzna"
  - name: "Susza"
    rating: "Średnie"
    atHome: "Gdy spada poziom Odry i wód gruntowych, gminy wprowadzają okresowe zakazy podlewania."
    firstAction: "W czasie suszy oszczędzaj wodę i miej w domu zapas wody pitnej na kilka dni."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Opolszczyzna"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Oblodzone drogi utrudniają dojazd, a długi mróz może uszkodzić ogrzewanie i zamrozić instalację wodną."
    firstAction: "Jesienią sprawdź, czy główny zawór wody łatwo się zakręca, i odłóż jedzenie na mroźne, zasypane dni."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Opolszczyzna"
