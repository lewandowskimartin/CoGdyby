searchName: "Opolszczyzna"
answer: "Na Opolszczyźnie najgroźniejsza jest powódź, a obok niej wichury i przerwy w prądzie. Oto praktyczny plan dla Twojego domu."
description: "Powódź na Odrze i Nysie Kłodzkiej, wichury, przerwy w prądzie i susza na Opolszczyźnie. Operatorzy, numery i plan na 30 minut dla domu."
