planOrder: [flood, power, storm, water, cold]
planNotes:
  flood: "Powodzie wracają tu regularnie. Mieszkańcy Opola, Nysy i Kędzierzyna-Koźla powinni sprawdzić, czy ich dom leży na terenie zalewowym."
  power: "W czasie powodzi prąd bywa wyłączany zapobiegawczo. Awarię zgłosisz pod 991."
  storm: "Na ostrzeżenie IMGW przed wiatrem reaguj od razu, zanim zacznie mocno wiać."
  water: "Latem gminy mogą ograniczać pobór wody. W Opolu awarię zgłosisz pod 994."
  cold: "Zabezpiecz instalację przed mrozem i zrób zapas na dni, gdy drogi są oblodzone."
