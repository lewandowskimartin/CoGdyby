  - name: "Powódź tysiąclecia"
    date: "Lipiec 1997"
    summary: "Opole było jednym z najbardziej poszkodowanych miast. Woda zalała dużą część miasta i południa regionu, a mieszkańcy zostali bez prądu, wody i łączności."
    source:
      url: "https://pl.wikipedia.org/wiki/Pow%C3%B3d%C5%BA_tysi%C4%85clecia"
      manual: true
      checked: 2026-10-19
      title: "Powódź tysiąclecia (1997), Opolszczyzna"
  - name: "Powódź (niż Boris)"
    date: "Wrzesień 2024"
    summary: "Ulewne deszcze zalały południe Opolszczyzny, m.in. Nysę i Głuchołazy. Tysiące domów na wiele dni zostały bez prądu i wody pitnej."
    source:
      url: "https://www.gov.pl/web/rcb"
      manual: true
      checked: 2026-10-19
      title: "Powódź 2024, komunikaty RCB, Opolszczyzna"
