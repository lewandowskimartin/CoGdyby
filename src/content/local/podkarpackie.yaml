risks:
  - name: "Wezbrania Sanu i Wisłoka"
    rating: "Bardzo wysokie"
    atHome: "Po ulewach w Karpatach San, Wisłok i Wisłoka bardzo szybko zalewają doliny w okolicach Przemyśla i Jasła."
    firstAction: "Sprawdzaj stany wód Sanu i Wisłoka na stronie IMGW, a dokumenty trzymaj w jednym pojemniku, który łatwo zabrać."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Podkarpacie"
  - name: "Osuwiska w Bieszczadach i Beskidzie"
    rating: "Wysokie"
    atHome: "Po długich deszczach strome, rozmoknięte stoki Bieszczadów mogą się osuwać i niszczyć drogi oraz budynki."
    firstAction: "Po kilku dniach deszczu sprawdzaj, czy ziemia wokół domu nie pęka i się nie przesuwa. Niepokojące zmiany zgłaszaj w gminie."
    source:
      url: "https://www.gov.pl/web/rcb"
      manual: true
      checked: 2026-10-19
      title: "Osuwiska, komunikaty RCB, Podkarpacie"
  - name: "Śnieżyce i siarczysty mróz"
    rating: "Wysokie"
    atHome: "W Bieszczadach zima bywa długa i mroźna, a zaspy potrafią na kilka dni odciąć wsie."
    firstAction: "Opał i zapasy zgromadź jesienią, a w czasie mrozu i zawiei nie wyjeżdżaj w góry bez potrzeby."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Podkarpacie"
  - name: "Wichury w dolinach"
    rating: "Wysokie"
    atHome: "Wiatr wiejący z gór łamie drzewa przy drogach i zrywa linie w rozległych, zalesionych gminach."
    firstAction: "Po ostrzeżeniu IMGW schowaj luźne rzeczy z podwórka i przygotuj latarki na wieczór bez prądu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Podkarpacie"
  - name: "Przerwy w prądzie"
    rating: "Średnie"
    atHome: "Po śnieżycy czy wichurze naprawa linii w górskich i wiejskich gminach trwa dłużej niż w mieście."
    firstAction: "Trzymaj w domu radio na baterie, bo w górach razem z prądem często znika zasięg."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, PGE Dystrybucja, Podkarpacie"
