name: "Podkarpacie"
searchName: "Podkarpacie"
answer: "Na Podkarpaciu najgroźniejsze są gwałtowne wezbrania rzek, osuwiska i śnieżne zimy w Bieszczadach. Oto praktyczny plan dla Twojego domu."
description: "Wezbrania Sanu i Wisłoka, osuwiska, śnieżyce i wichury na Podkarpaciu. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
