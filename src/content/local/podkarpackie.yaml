  cold: "Bieszczadzka zima potrafi odciąć wieś na kilka dni, więc opał i zapasy warto zgromadzić jesienią."
  storm: "Wiatr z gór łamie drzewa przy drogach. Po ostrzeżeniu IMGW zostańcie w domu."
