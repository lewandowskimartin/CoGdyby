planOrder: [power, storm, flood, cold, water]
planNotes:
  power: National Grid Electricity Distribution runs the network here. If anyone at home relies on power for their health, join its free Priority Services Register for extra help in a long cut.
  storm: Warnings for Cornwall and Scilly can come a day or more ahead. On the islands, use that time to stock up in case boats and flights stop.
  flood: Coastal and river flooding are both on the register here. Sign up for warnings for your home and anywhere you drive through often.
  cold: Snow is rare at sea level but Dartmoor, Exmoor and Bodmin Moor roads can close. Plan for three days at home if you live on high ground.
  water: South West Water supplies Devon, Cornwall and the Isles of Scilly. Its priority services register is free.

