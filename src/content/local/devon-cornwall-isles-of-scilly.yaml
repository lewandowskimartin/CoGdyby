draft: true

name: Devon, Cornwall and the Isles of Scilly
searchName: Devon and Cornwall

answer: The local risk register scores a national power failure, storms, surface water flooding and long cold spells among its top risks, and Storm Goretti showed in January 2026 what that looks like here.
description: What the Devon, Cornwall and Isles of Scilly risk register means for your home, who to call in a power cut or storm, and a 30-minute plan.

