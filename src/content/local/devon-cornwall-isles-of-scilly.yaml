risks:
  - name: National power failure
    rating: Impact 5 of 5
    likelihood: 3
    impact: 5
    atHome: Remote homes can be among the last reconnected, so a long cut can run into days.
    firstAction: Keep a torch, a wind-up or battery radio and a charged power bank in one drawer.
    source:
      <<: *register
      quote: Failure of the national electricity transmission system
  - name: Storms
    rating: Impact 3 of 5
    likelihood: 4
    impact: 3
    atHome: Gales bring down trees and power lines, close coast roads and can stop ferries and flights to Scilly.
    firstAction: When an amber or red warning is issued, charge everything and fill a few bottles with water.
    source:
      <<: *register
      quote: Storms
  - name: Surface water flooding
    rating: Impact 4 of 5
    likelihood: 4
    impact: 4
    atHome: Sudden downpours run off steep hills into lanes and town centres faster than drains can cope.
    firstAction: Find your stopcock and the switch that turns your electricity off.
    source:
      <<: *register
      quote: Surface water flooding
  - name: Prolonged cold, snow and ice
    rating: Impact 4 of 5
    likelihood: 4
    impact: 4
    atHome: Moorland and rural roads can close, cutting villages off from shops and care visits.
    firstAction: Plan one warm room and stock three days of food you can eat without cooking.
    source:
      <<: *register
      quote: Prolonged low temperatures, snow and / or ice
  - name: Coastal flooding
    rating: Impact 4 of 5
    likelihood: 3
    impact: 4
    atHome: High tides with storm surges can flood seafront homes and harbour streets.
    firstAction: If you live near the sea, sign up for flood warnings and know your way inland.
    source:
      <<: *register
      quote: Coastal flooding
  - name: River flooding
    rating: Impact 4 of 5
    likelihood: 3
    impact: 4
    atHome: Short, steep rivers can burst their banks within hours of heavy rain.
    firstAction: Check your address on the long-term flood risk map.
    source:
      <<: *register
      quote: Fluvial flooding

