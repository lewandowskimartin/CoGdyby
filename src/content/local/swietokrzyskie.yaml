searchName: "Świętokrzyskie"
answer: "W Świętokrzyskiem najgroźniejsza jest powódź nad Wisłą, a obok niej nawałnice z gradem i susza. Dom przygotujesz w kilku krokach opisanych niżej."
description: "Powódź nad Wisłą, nawałnice, susza i wichury w świętokrzyskim. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
