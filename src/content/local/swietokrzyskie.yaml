planOrder: [flood, storm, water, power, cold]
planNotes:
  flood: "Pod Sandomierzem woda potrafi wrócić kilka razy w jednym roku. Sprawdź swoją okolicę na mapie i trzymaj cenne rzeczy wyżej."
  storm: "Burze z gradem przychodzą szybko, dlatego latem warto codziennie zerknąć na ostrzeżenia IMGW."
  water: "Latem gminy mogą ograniczać pobór wody. W Kielcach awarię zgłosisz pod 994."
  power: "Po wichurze wsie potrafią na wiele godzin zostać bez prądu."
  cold: "Zaizoluj instalację wodną i trzymaj zapasy na wypadek zasypanych dróg."
