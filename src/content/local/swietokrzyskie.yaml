risks:
  - name: "Powódź pod Sandomierzem"
    rating: "Bardzo wysokie"
    atHome: "W 2010 roku Wisła zalała Sandomierz i okolice dwa razy w ciągu kilku tygodni."
    firstAction: "Jeśli mieszkasz w dolinie Wisły lub Nidy, sprawdź mapę w Hydroportalu ISOK i trzymaj najcenniejsze rzeczy wyżej."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Świętokrzyskie"
  - name: "Nawałnice z gradem"
    rating: "Wysokie"
    atHome: "Letnie burze z gradem niszczą sady i dachy oraz zrywają napowietrzne linie energetyczne."
    firstAction: "Gdy IMGW ostrzega przed burzą, wstaw samochód pod dach i naładuj telefony, zanim zacznie padać."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Świętokrzyskie"
  - name: "Susza"
    rating: "Wysokie"
    atHome: "Lekkie gleby szybko wysychają, a przy niskim stanie Nidy i Kamiennej gminy ograniczają pobór wody."
    firstAction: "Przy zakazie podlewania korzystaj z deszczówki i miej w domu zapas wody do picia."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Świętokrzyskie"
  - name: "Wichury"
    rating: "Wysokie"
    atHome: "Silny wiatr w Górach Świętokrzyskich przewraca drzewa, a wsie zostają bez prądu na wiele godzin."
    firstAction: "Po ostrzeżeniu IMGW zabezpiecz podwórko i przygotuj latarkę oraz power bank na wieczór."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Świętokrzyskie"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "W pagórkowatym terenie gołoledź i zaspy utrudniają dojazd, a mróz obciąża ogrzewanie."
    firstAction: "Jesienią zaizoluj rury i miej w domu jedzenie na czas, gdy śnieg zablokuje drogi."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Świętokrzyskie"
