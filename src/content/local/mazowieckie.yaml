pastEvents:
  - name: Powódź na Wiśle
    date: Maj 2010
    summary: Wysoka fala na Wiśle zagroziła Warszawie i zalała tereny w regionie, m.in. w okolicach Płocka. Część mieszkańców ewakuowano, a wały umacniano workami z piaskiem.
    source:
      url: https://pl.wikipedia.org/wiki/Pow%C3%B3d%C5%BA_w_Polsce_(2010)
      manual: true
      checked: 2026-10-19
      title: Powódź w Polsce (2010)
  - name: Ograniczenia w dostawie prądu (stopnie zasilania)
    date: Sierpień 2015
    summary: Upał i susza ograniczyły pracę elektrowni. Wprowadzono 20. stopień zasilania, czyli ograniczenia poboru prądu dla dużych odbiorców. To przykład, jak pogoda może obciążyć sieć.
    source:
      url: https://pl.wikipedia.org/wiki/Stopnie_zasilania
      manual: true
      checked: 2026-10-19
      title: Stopnie zasilania (2015)

