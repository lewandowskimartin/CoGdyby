name: Mazowsze
searchName: Mazowsze
answer: Na Mazowszu i w Warszawie najczęściej dokuczają wichury, przerwy w prądzie i upały. Dom przygotujesz w kilku krokach opisanych niżej.
description: Przerwy w prądzie, wichury, upały i wezbrania Wisły w Warszawie i na Mazowszu. Operatorzy, numery alarmowe i plan na 30 minut dla domu.

