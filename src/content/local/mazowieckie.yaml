planOrder: [power, storm, heat, flood, water]
planNotes:
  power: "W Warszawie siecią zarządza Stoen Operator, a poza stolicą głównie PGE. W obu przypadkach awarię zgłosisz pod 991."
  storm: "Front burzowy zrywa sieć trakcyjną i linie, więc po ostrzeżeniu IMGW lepiej zostać w domu."
  heat: "W mieście upał jest bardziej dokuczliwy. Wietrz rano i wieczorem i pamiętaj o starszych bliskich."
  flood: "Wisła i Narew potrafią podtopić nadrzeczne dzielnice. Sprawdź swój adres w Hydroportalu ISOK."
  water: "W Warszawie awarię wodociągu zgłosisz pod 994."
