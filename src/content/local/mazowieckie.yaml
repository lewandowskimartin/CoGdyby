risks:
  - name: "Przerwy w prądzie w stolicy"
    rating: "Wysokie"
    atHome: "W Warszawie jedna awaria potrafi wyłączyć światło, windy i pompy w całych kwartałach bloków. W upale w 2015 roku wprowadzono ograniczenia poboru prądu dla dużych firm."
    firstAction: "Jeśli mieszkasz w bloku, trzymaj w mieszkaniu latarkę i zapas wody. Awarię zgłosisz pod 991."
    source:
      url: "https://www.stoen.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Stoen Operator, Mazowsze"
  - name: "Wichury i letnie nawałnice"
    rating: "Wysokie"
    atHome: "Gwałtowny front burzowy łamie drzewa w parkach i przy drogach, zrywa sieć trakcyjną i linie od Warszawy po Płock."
    firstAction: "Po ostrzeżeniu IMGW zabezpiecz balkon, a telefony i power banki naładuj jeszcze przed wieczorem."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Mazowsze"
  - name: "Upał i miejska wyspa ciepła"
    rating: "Wysokie"
    atHome: "Nagrzane ulice i bloki Warszawy nie stygną w nocy. Długie upały są szczególnie trudne dla seniorów i małych dzieci."
    firstAction: "W upał zasłaniaj okna w ciągu dnia, pamiętaj o piciu wody i dzwoń do starszych osób, które mieszkają same."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Mazowsze"
  - name: "Wezbrania Wisły i Narwi"
    rating: "Średnie"
    atHome: "Wysoka woda na Wiśle i Narwi zagraża nadrzecznym dzielnicom i gminom pod Płockiem, jak podczas powodzi w 2010 roku."
    firstAction: "Jeśli mieszkasz blisko rzeki, sprawdź mapę w Hydroportalu ISOK i ustalcie, co przenosicie wyżej w razie alarmu."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Mazowsze"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Gołoledź potrafi sparaliżować komunikację w aglomeracji, a mróz obciąża ogrzewanie w starszych budynkach."
    firstAction: "Przed zimą zrób zapas jedzenia i leków na dni, gdy dojazd do pracy i sklepu jest utrudniony."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (mróz, śnieg), Mazowsze"
