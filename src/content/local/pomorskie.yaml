name: "Pomorze"
searchName: "Pomorze"
answer: "Na Pomorzu najgroźniejsze są sztormowe wichury znad Bałtyku, gwałtowne nawałnice i podtopienia. Sprawdź, jak krok po kroku przygotować dom."
description: "Sztormy, nawałnice, podtopienia na Żuławach i przerwy w prądzie w województwie pomorskim. Operatorzy, numery i plan na 30 minut dla domu."
