  - name: "Powódź w Gdańsku"
    date: "Lipiec 2001"
    summary: "Ulewny deszcz w ciągu kilku godzin zalał dużą część Gdańska. Woda płynęła ulicami i zalała piwnice oraz parterowe mieszkania."
    source:
