planOrder: [storm, power, flood, water, cold]
planNotes:
  storm: "Sztormy znad Zatoki Gdańskiej są tu największym zagrożeniem. W czasie ostrzeżenia trzymajcie się z dala od plaży i nabrzeży."
  power: "Po sztormie nadmorskie gminy mogą długo czekać na prąd. Awarię zgłosisz pod 991."
  flood: "Na Żuławach woda zbiera się szybko. Ustal z rodziną, którędy wyjedziecie, gdyby trzeba było się ewakuować."
  water: "W Gdańsku awarię wodociągu zgłosisz pod 994."
  cold: "Nad morzem mróz jest wilgotny i dokuczliwy. Zaizoluj rury i zrób zapas na zimowe dni."
