risks:
  - name: "Sztormy znad Zatoki Gdańskiej"
    rating: "Bardzo wysokie"
    atHome: "Wiatr od Bałtyku potrafi zrywać dachy w Trójmieście i spiętrzać wodę w Zatoce Gdańskiej oraz u ujścia Wisły."
    firstAction: "Przy ostrzeżeniu IMGW przed sztormem nie spaceruj po falochronach i molo, zabezpiecz balkon i przygotuj się na przerwę w prądzie."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (sztorm), Pomorze"
  - name: "Nawałnice w borach"
    rating: "Wysokie"
    atHome: "Nawałnica z sierpnia 2017 roku połamała lasy pod Chojnicami, były ofiary śmiertelne, a dziesiątki tysięcy domów zostały bez prądu."
    firstAction: "Latem sprawdzaj ostrzeżenia IMGW przed wyjazdem pod namiot lub na obóz dziecka i nie zostawajcie w lesie, gdy zapowiadają gwałtowne burze."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Pomorze"
  - name: "Podtopienia na Żuławach"
    rating: "Wysokie"
    atHome: "Część Żuław leży poniżej poziomu morza. Przy sztormie i ulewach woda zbiera się tu szybciej, niż pompownie zdążą ją odprowadzić."
    firstAction: "Jeśli mieszkasz na Żuławach, sprawdź mapę w Hydroportalu ISOK i ustal, którędy wyjedziecie w razie ewakuacji."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Pomorze"
  - name: "Przerwy w prądzie"
    rating: "Wysokie"
    atHome: "Po sztormie nadmorskie i wiejskie gminy potrafią zostać bez prądu na wiele godzin."
    firstAction: "Jesienią i zimą trzymaj latarki i power bank w gotowości. Awarię zgłosisz pod numerem 991."
    source:
      url: "https://energa-operator.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Energa Operator, Pomorze"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Wilgotny chłód i gołoledź utrudniają dojazd, a wiatr od morza sprawia, że mróz jest bardziej odczuwalny."
    firstAction: "Przed zimą zaizoluj rury w nieogrzewanych miejscach i zrób zapas na dni z gołoledzią."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (mróz, śnieg), Pomorze"
