planOrder: [storm, power, flood, water, heat]
planNotes:
  storm: "W borach wiatr łamie drzewa, które blokują drogi. Po ostrzeżeniu IMGW lepiej odłożyć wyjazd."
  power: "W leśnych osadach prąd wraca wolniej. Awarię zgłosisz pod 991, a mapę awarii znajdziesz u Enei."
  flood: "Odra i Warta zagrażają nadrzecznym miastom. Sprawdź swoją okolicę na mapie zagrożenia powodziowego."
  water: "W czasie suszy gminy mogą ograniczać pobór wody. W Zielonej Górze awarię zgłosisz pod 994."
  heat: "W upał uważaj na ogień przy suchej trawie i chroń mieszkanie przed nagrzaniem."
