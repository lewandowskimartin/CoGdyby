risks:
  - name: "Pożary rozległych borów"
    rating: "Wysokie"
    atHome: "Lubuskie to jeden z najbardziej zalesionych regionów kraju. W czasie suszy ogień w borach szybko się rozprzestrzenia i może zagrozić pobliskim wsiom."
    firstAction: "Przy wysokim zagrożeniu pożarowym nie rozpalaj ognia w lesie ani obok niego, sprawdzaj komunikaty nadleśnictwa i znaj drogę wyjazdu z osady."
    source:
      url: "https://www.gov.pl/web/rcb"
      manual: true
      checked: 2026-10-19
      title: "Zagrożenie pożarowe lasów, RCB, Lubuskie"
  - name: "Wichury w lasach"
    rating: "Wysokie"
    atHome: "Silny wiatr przewraca drzewa w dużych kompleksach leśnych. Blokują one drogi i zrywają linie prowadzące do leśnych osad."
    firstAction: "Po ostrzeżeniu IMGW nie jedź przez las, zabezpiecz podwórko i przygotuj latarki na wieczór bez prądu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Lubuskie"
  - name: "Powódź na Odrze i Warcie"
    rating: "Wysokie"
    atHome: "Wezbrania Odry i Warty zagrażają m.in. Nowej Soli i Krosnu Odrzańskiemu. Fala z 1997 roku dotarła głęboko w region."
    firstAction: "Jeśli mieszkasz w dolinie Odry lub Warty, sprawdź mapę w Hydroportalu ISOK i przygotuj listę rzeczy do przeniesienia wyżej."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Lubuskie"
  - name: "Susza"
    rating: "Wysokie"
    atHome: "Piaszczyste gleby i małe opady sprawiają, że region szybko wysycha. Spada poziom rzek, a ryzyko pożarów rośnie."
    firstAction: "Latem oszczędzaj wodę z kranu i miej w domu kilka zgrzewek wody pitnej."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Lubuskie"
  - name: "Upały"
    rating: "Średnie"
    atHome: "Upały nagrzewają domy i zwiększają ryzyko pożarów traw i lasów."
    firstAction: "W upał zasłaniaj okna w dzień, pamiętaj o piciu wody i nie pal ogniska ani grilla na suchej trawie."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Lubuskie"
