name: "Lubuskie"
searchName: "Lubuskie"
answer: "W Lubuskiem najważniejsze są pożary lasów, wichury i powódź na Odrze. Poniżej opisujemy, co to oznacza dla domu i jak się przygotować."
description: "Pożary lasów, wichury, powódź na Odrze i susza w województwie lubuskim. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
