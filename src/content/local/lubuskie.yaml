pastEvents:
  - name: "Powódź na Odrze"
    date: "Lipiec 1997"
    summary: "Fala kulminacyjna na Odrze zagroziła nadrzecznym miejscowościom, m.in. Nowej Soli i Krosnu Odrzańskiemu. Mieszkańcy umacniali wały, a część z nich ewakuowano."
    source:
      url: "https://pl.wikipedia.org/wiki/Pow%C3%B3d%C5%BA_tysi%C4%85clecia"
      manual: true
      checked: 2026-10-19
      title: "Powódź 1997 (Odra), Lubuskie"
  - name: "Pożary lasów podczas suszy"
    date: "Lato 2019"
    summary: "Przez długą suszę zagrożenie pożarowe w lasach regionu przez wiele tygodni było bardzo wysokie. Wybuchało wiele pożarów, a nadleśnictwa wprowadzały zakazy wstępu do lasu."
    source:
      url: "https://www.gov.pl/web/rcb"
      manual: true
      checked: 2026-10-19
      title: "Zagrożenie pożarowe, RCB, Lubuskie"
