planOrder: [flood, power, storm, water, cold]
planNotes:
  flood: "W dolinach Odry i Nysy Kłodzkiej powódź to największe zagrożenie. Sprawdź, czy dom leży na terenie zalewowym i którędy dojdziecie wyżej."
  power: "Po wichurach w Sudetach naprawa linii może potrwać. Awarię zgłosisz pod 991, a mapę awarii znajdziesz na stronie Tauronu."
  storm: "Wiatr od strony Karkonoszy szybko się wzmaga, dlatego warto reagować już na ostrzeżenie pierwszego stopnia."
  water: "Latem gminy czasem ograniczają pobór wody. We Wrocławiu awarię wodociągu zgłosisz pod 994."
  cold: "W Kotlinie Kłodzkiej i w górach przygotuj dom na silny mróz i zasypane drogi."
