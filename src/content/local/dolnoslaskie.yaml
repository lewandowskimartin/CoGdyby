pastEvents:
  - name: Powódź (niż Boris)
    date: Wrzesień 2024
    summary: Ulewne deszcze w Kotlinie Kłodzkiej zalały m.in. Kłodzko, Lądek-Zdrój, Stronie Śląskie i Bystrzycę Kłodzką. Tysiące domów zostały bez prądu i wody pitnej, a Wrocław przez kilka dni przygotowywał się na falę kulminacyjną na Odrze.
    source:
      url: https://www.gov.pl/web/rcb
      manual: true
      checked: 2026-10-19
      title: Powódź 2024, komunikaty RCB
  - name: Powódź tysiąclecia
    date: Lipiec 1997
    summary: Największa powódź w powojennej historii regionu zalała dużą część Wrocławia i południowego Dolnego Śląska. Wielu mieszkańców na długo zostało bez prądu, wody i łączności.
    source:
      url: https://pl.wikipedia.org/wiki/Pow%C3%B3d%C5%BA_tysi%C4%85clecia
      manual: true
      checked: 2026-10-19
      title: Powódź tysiąclecia (1997)

