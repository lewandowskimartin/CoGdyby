risks:
  - name: "Powódź i gwałtowne wezbrania"
    rating: "Bardzo wysokie"
    atHome: "Odra, Nysa Kłodzka i górskie potoki w Sudetach potrafią w ciągu jednej nocy zalać Kłodzko, Lądek-Zdrój czy Stronie Śląskie. Tak było w 1997 i 2024 roku."
    firstAction: "Sprawdź w Hydroportalu ISOK, czy dom w dolinie Odry lub Nysy Kłodzkiej leży na terenie zagrożonym zalaniem, i ustal, co przeniesiesz na piętro."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Dolny Śląsk"
  - name: "Wichury w Sudetach i na nizinie"
    rating: "Wysokie"
    atHome: "Silny wiatr łamie drzewa w dolnośląskich lasach i zrywa linie od Wrocławia po Karkonosze. Prąd potrafi wtedy zniknąć na wiele godzin."
    firstAction: "Gdy IMGW wyda ostrzeżenie dla Twojego powiatu, zdejmij z balkonu luźne rzeczy i naładuj telefony, zanim wiatr się wzmoże."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Dolny Śląsk"
  - name: "Przerwy w dostawie prądu"
    rating: "Wysokie"
    atHome: "Po wichurze albo przy oblodzeniu linii gaśnie światło, przestaje działać piec gazowy, a zamrażarka zaczyna się rozmrażać."
    firstAction: "Trzymaj latarkę, power bank i radio w jednej szufladzie. Numer pogotowia energetycznego 991 zapisz na kartce."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie i wyłączenia, Tauron, Dolny Śląsk"
  - name: "Susza i niżówki na Odrze"
    rating: "Średnie"
    atHome: "Przy niskim stanie Odry i spadku wód gruntowych niektóre gminy ograniczają pobór wody, na przykład do podlewania ogrodów."
    firstAction: "Gdy gmina apeluje o oszczędzanie wody, ogranicz podlewanie i miej w domu kilka zgrzewek wody pitnej."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Dolny Śląsk"
  - name: "Mróz i śnieg w górach"
    rating: "Średnie"
    atHome: "W Kotlinie Kłodzkiej i w Sudetach mróz bywa ostry, a śnieg potrafi na kilka dni odciąć górskie wsie."
    firstAction: "Przed zimą zaizoluj rury w nieogrzewanych pomieszczeniach i zrób zapas jedzenia na dni, gdy drogi są nieprzejezdne."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Dolny Śląsk"
