name: Dolny Śląsk
searchName: Dolny Śląsk
answer: Na Dolnym Śląsku największym zagrożeniem jest powódź, a po niej wichury i przerwy w prądzie. Poniżej opisujemy, co to oznacza dla domu i jak się przygotować.
description: Powódź, wichury i przerwy w prądzie na Dolnym Śląsku. Lokalni operatorzy, numery alarmowe i plan na 30 minut dla Twojego domu.

