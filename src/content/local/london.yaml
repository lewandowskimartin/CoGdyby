planOrder: [flood, heat, evacuation, power, water]
planNotes:
  flood: Most London flooding starts with rain the drains can't take. Basement and ground-floor homes should sign up for warnings and keep a bag ready by the door.
  heat: Open windows at night when it's cooler outside, then close them and draw the blinds in the morning.
  evacuation: In a block of flats, know your building's fire plan and where the stairs come out. Agree a meeting point outside with everyone at home.
  power: UK Power Networks runs the network in most of London. Its free Priority Services Register gives extra help in a cut to anyone who relies on power for their health.
  water: Use Water UK's postcode checker to find your water company, then join its priority services register if anyone at home needs extra help.

