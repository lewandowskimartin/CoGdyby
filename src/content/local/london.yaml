# London: facts and copy for /local/london/ (template: src/pages/local/[area].astro).
# Every `source` holds the exact words on its page; `npm run check:sources -- --area london`
# confirms they're still there. The London Risk Register (Version 14, January 2025) is aligned
# to the 2022 national assessment; the page says so in the edition line.

draft: true

name: London

answer: The London Risk Register rates surface water flooding, heatwaves, fires in high-rise flats and a national power failure among its very high risks for the capital.
description: What the London Risk Register means for your home, from flash floods and heat to high-rise fires and power cuts, plus a 30-minute plan.

