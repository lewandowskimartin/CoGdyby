  name: London Resilience Partnership
  url: https://www.london.gov.uk/programmes-strategies/fire-and-resilience/london-resilience-partnership
  email: londonresilience@london.gov.uk
  source:
    url: https://www.gov.uk/guidance/local-resilience-forums-contact-details
    quote: londonresilience@london.gov.uk
    checked: 2026-10-15

register:
  title: London Risk Register
  edition: Version 14, January 2025 (based on the 2022 national assessment)
  url: https://www.london.gov.uk/media/109576/download
  system: labels
  source: &register
    url: https://www.london.gov.uk/media/109576/download
    quote: [VERSION 14, aligned to the 2022 National Security Risk Assessment]
    checked: 2026-10-15

risks:
  - name: Surface water flooding
    rating: Very high
    likelihood: 3
    impact: 4
    atHome: A summer cloudburst can fill basements, ground-floor flats and underpasses within an hour.
    firstAction: If you live below street level, keep valuables and documents off the floor.
    source:
      <<: *register
      quote: Surface Water Flooding
  - name: Heatwaves
    rating: Very high
    likelihood: 3
    impact: 4
    atHome: The city holds heat overnight, and top-floor flats can stay dangerously warm.
    firstAction: Find the coolest room you can use, and keep blinds shut on sunny windows.
    source:
      <<: *register
      quote: High Temperatures and heatwaves
  - name: Fires in high-rise flats
    rating: Very high
    likelihood: 4
    impact: 4
    atHome: What to do depends on your building's fire plan, which can change after a safety review.
    firstAction: Find out whether your building's plan says stay put or leave, and know two ways out.
    source:
      <<: *register
      quote: Fires in purpose built high-rise flats
  - name: National power failure
    rating: Very high
    likelihood: 3
    impact: 5
    atHome: Lifts, door entry systems, card payments and much of the transport network can all stop together.
    firstAction: Keep a torch on each floor you use and know how you'd get down without the lift.
    source:
      <<: *register
      quote: Failure of National Electricity Transmission System
  - name: Low temperatures and snow
    rating: Very high
    likelihood: 4
    impact: 4
    atHome: Snow rarely lasts long in London, but ice and cold strain transport, boilers and older neighbours.
    firstAction: Book a boiler service before winter and keep a few days of food in.
    source:
      <<: *register
      quote: Low temperatures and snow
  - name: River flooding
    rating: Very high
    likelihood: 3
    impact: 4
    atHome: Smaller rivers in outer boroughs can overtop after prolonged rain.
    firstAction: Check your address on the long-term flood risk map.
    source:
      <<: *register
      quote: Fluvial Flooding

