planOrder: [storm, power, flood, heat, cold]
planNotes:
  storm: "W aglomeracji jedna wichura może odciąć prąd w kilku miastach, więc ostrzeżenia IMGW warto traktować poważnie."
  power: "W wysokim bloku awaria to brak windy i czasem wody. Trzymaj zapas w mieszkaniu, a awarię zgłoś pod 991."
  flood: "Na południu województwa wzbierają górna Wisła i dopływy Odry. Sprawdź, czy Twój dom leży na terenie zalewowym."
  heat: "W nagrzanym mieście upał jest bardziej męczący. Wietrz rano i wieczorem, a w południe trzymaj okna zamknięte."
  cold: "Gołoledź utrudnia dojazd, więc zapas jedzenia i leków na kilka dni bardzo się przydaje."
