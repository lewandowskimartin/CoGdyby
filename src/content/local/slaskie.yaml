name: "Śląsk"
searchName: "Śląsk"
answer: "Na Śląsku, w gęsto zabudowanej aglomeracji, najważniejsze są wichury i przerwy w prądzie, powódź na południu województwa oraz upały w mieście. Dom przygotujesz w kilku krokach opisanych niżej."
description: "Wichury, awarie prądu w blokach, powódź na południu i upały w miastach Śląska. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
