risks:
  - name: "Wichury nad aglomeracją"
    rating: "Wysokie"
    atHome: "W gęstej zabudowie od Gliwic po Sosnowiec jedna wichura potrafi odciąć prąd w kilku miastach jednocześnie."
    firstAction: "Przy ostrzeżeniu IMGW zdejmij luźne rzeczy z balkonu i naładuj telefony oraz power banki."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Śląsk"
  - name: "Awaria prądu w blokach"
    rating: "Wysokie"
    atHome: "W wysokim bloku awaria prądu to brak windy, a często też wody na wyższych piętrach, bo pompy przestają działać."
    firstAction: "Jeśli mieszkasz na wysokim piętrze, trzymaj w mieszkaniu latarkę i zapas wody. Awarię zgłosisz pod 991."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie i wyłączenia, Tauron, Śląsk"
  - name: "Powódź na południu województwa"
    rating: "Wysokie"
    atHome: "Po ulewach w Beskidach górna Wisła i dopływy Odry wzbierają i zalewają miejscowości na południu województwa."
    firstAction: "Sprawdź swoją miejscowość w Hydroportalu ISOK i ustalcie, dokąd przenosicie sprzęt i dokumenty."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Śląsk"
  - name: "Upał i smog w mieście"
    rating: "Wysokie"
    atHome: "Nagrzane miasta nie stygną w nocy, a w upalne dni pogarsza się jakość powietrza. To szczególnie trudne dla seniorów i małych dzieci."
    firstAction: "W upalne dni zasłaniaj okna, pamiętaj o piciu wody i zaglądaj do starszych sąsiadów z bloku."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Śląsk"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Gołoledź potrafi sparaliżować komunikację w aglomeracji, a mróz mocno obciąża ogrzewanie w starych kamienicach."
    firstAction: "Przed zimą zrób zapas jedzenia na dni, gdy tramwaje i autobusy jeżdżą z dużymi opóźnieniami."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Śląsk"
