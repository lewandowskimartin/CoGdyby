planNotes:
  storm: "Wiatr od morza i Zalewu Szczecińskiego bywa tu najgroźniejszy. W czasie ostrzeżenia trzymaj się z dala od brzegu i portu."
  power: "W 2008 roku oblodzenie odcięło prąd całemu Szczecinowi. Zimą miej naładowany power bank i latarki, a awarię zgłoś pod 991."
  flood: "Cofka i wysoka Odra zalewają Międzyodrze i nisko położone osiedla. Sprawdź swój adres w Hydroportalu ISOK."
  water: "W Szczecinie i okolicy awarię wodociągu zgłosisz pod 994."
  cold: "Wilgotny mróz oblodza linie. Zaizoluj rury i przygotuj zapas na wypadek dłuższej przerwy w prądzie."
