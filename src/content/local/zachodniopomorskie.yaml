name: "Pomorze Zachodnie"
searchName: "Pomorze Zachodnie"
answer: "Na Pomorzu Zachodnim najgroźniejsze są sztormy znad Bałtyku i oblodzenie linii, które w 2008 roku odcięło prąd setkom tysięcy osób. Zobacz, co to oznacza dla domu i jak się przygotować."
description: "Sztormy, blackout po oblodzeniu linii, cofka na Zalewie Szczecińskim i przerwy w prądzie. Operatorzy, numery i plan na 30 minut dla domu."
