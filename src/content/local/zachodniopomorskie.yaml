risks:
  - name: "Sztormy i wichury od Bałtyku"
    rating: "Bardzo wysokie"
    atHome: "Wiatr od morza i Zalewu Szczecińskiego potrafi zrywać dachy w Szczecinie i Świnoujściu oraz spiętrzać wodę u ujścia Odry."
    firstAction: "W czasie ostrzeżenia przed sztormem trzymaj się z dala od portu i brzegu Zalewu, zdejmij rzeczy z balkonu i przygotuj latarki."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (sztorm), Pomorze Zachodnie"
  - name: "Rozległy blackout po oblodzeniu"
    rating: "Wysokie"
    atHome: "8 kwietnia 2008 roku mokry śnieg oblepił linie i powalił słupy wysokiego napięcia. Bez prądu zostało ponad 500 tysięcy osób, część z nich na ponad dobę."
    firstAction: "Od jesieni do wiosny trzymaj w gotowości latarkę, power bank, radio i koce. Awarię zgłosisz pod 991."
    source:
      url: "https://www.gramwzielone.pl/trendy/102789/blackout-co-oznacza-najglosniejsze-przypadki-i-jak-sie-przed-nim-ochronic"
      manual: true
      checked: 2026-10-19
      title: "Blackout – najgłośniejsze przypadki (Gramwzielone.pl)"
  - name: "Spiętrzenia sztormowe i podtopienia"
    rating: "Wysokie"
    atHome: "Gdy silny wiatr od morza cofa wodę w Odrze (tzw. cofka), podtapiane są nisko położone osiedla i Międzyodrze."
    firstAction: "Jeśli mieszkasz nisko przy wodzie, sprawdź mapę w Hydroportalu ISOK i obserwuj ostrzeżenia IMGW przed spiętrzeniem."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Pomorze Zachodnie"
  - name: "Przerwy w prądzie"
    rating: "Wysokie"
    atHome: "Po sztormie albo oblodzeniu linii nadmorskie i wiejskie gminy mogą na wiele godzin zostać bez prądu."
    firstAction: "Pilnuj, żeby power bank był zawsze naładowany, a latarki miały baterie. Awarię zgłosisz pod 991."
    source:
      url: "https://www.operator.enea.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Enea Operator, Pomorze Zachodnie"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Wilgotny chłód i oblodzenie linii energetycznych to tu realne zagrożenie, co pokazał 2008 rok."
    firstAction: "Jesienią zaizoluj rury i zrób zapas jedzenia, bo po oblodzeniu linii prąd może wracać długo."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (mróz, śnieg), Pomorze Zachodnie"
