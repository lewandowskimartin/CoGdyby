register:
  title: Nottingham and Nottinghamshire Community Risk Register
  edition: Version 8.0, 2025
  url: https://www.nottinghamcity.gov.uk/media/sybbyfav/nottingham-nottinghamshire-community-risk-register-v901-november-2025.pdf
  system: scores
  source: &register
    url: https://www.nottinghamcity.gov.uk/media/sybbyfav/nottingham-nottinghamshire-community-risk-register-v901-november-2025.pdf
    quote: version 8.0 of the Community Risk Register
    checked: 2026-10-15

risks:
  - name: Loss of power, water, gas or phone lines
    rating: Impact 5 of 5
    impact: 5
    page: 12
    atHome: Several services can fail at once, and getting all of them back can take days.
    firstAction: If anyone at home relies on electricity for their health, join the Priority Services Register.
    source:
      <<: *register
      quote: Loss of Critical Infrastructure
  - name: River flooding
    rating: Impact 4 of 5
    impact: 4
    page: 16
    atHome: The Trent and its tributaries can rise for days after heavy rain upstream, reaching homes in riverside towns and villages.
    firstAction: Check your address on the long-term flood risk map, then sign up for warnings.
    source:
      <<: *register
      quote: Flooding (Rivers)
  - name: Low temperatures and snow
    rating: Impact 3 of 5
    impact: 3
    page: 24
    atHome: Icy side roads and pavements can keep older neighbours indoors and stop home visits.
    firstAction: Keep a week of regular medicines in and plan one room to keep warm.
    source:
      <<: *register
      quote: 'Extreme Weather: Low Temperatures and Snow'
  - name: Heatwave
    rating: Impact 3 of 5
    impact: 3
    page: 22
    atHome: Upstairs rooms and loft conversions can stay hot right through the night.
    firstAction: Work out which room stays coolest, and shade sunny windows from late morning.
    source:
      <<: *register
      quote: 'Extreme Weather: Heatwave'
  - name: Pandemic
    rating: Impact 5 of 5
    impact: 5
    page: 14
    atHome: Schools and workplaces can close, and you may need to stay home for weeks.
    firstAction: Keep two weeks of regular medicines and household basics.
    source:
      <<: *register
      quote: Pandemic

