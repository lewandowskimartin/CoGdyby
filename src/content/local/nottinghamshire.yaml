planOrder: [power, flood, water, cold, heat]
planNotes:
  power: National Grid Electricity Distribution runs the network here. Its free Priority Services Register can warn you before planned cuts and prioritise you in long ones.
  flood: Storm Babet flooded homes in 92 Nottinghamshire communities. If you live near the Trent or one of its tributaries, add warnings for that river as well as your own address.
  water: Most homes are on Severn Trent, and much of Bassetlaw is on Anglian Water. Both run a free priority services register for bottled water deliveries.
  cold: Side streets and village roads are usually the last to be gritted, so plan as if you can't drive for a few days.
  heat: Loft conversions and top-floor flats get hottest. If someone you know lives in one on their own, plan to ring them each day of a heatwave.

