# Nottinghamshire: facts and copy for /local/nottinghamshire/ (template: src/pages/local/[area].astro).
# Every `source` holds the exact words on its page; `npm run check:sources -- --area nottinghamshire`
# confirms they're still there. answer, description, atHome, firstAction and planNotes are our own
# words, but they must agree with the sourced facts.
# TODO(Martin): the register's likelihood scores sit in the risk matrix on p.11 and don't survive
# text extraction, so only impact scores are shown. Read them by eye and add `likelihood:` if wanted.
# A short first-hand note from you (firstHandNote) would also go well here.

draft: true

name: Nottinghamshire

answer: Nottinghamshire's 2025 risk register gives its highest impact scores to losing power, water or gas and to a pandemic, with flooding from the Trent and its tributaries close behind.
description: What the Nottingham and Nottinghamshire risk register means for your home, who to call in a power cut or flood, and a 30-minute plan.

