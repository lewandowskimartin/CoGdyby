planOrder: [water, storm, flood, cold, power]
planNotes:
  water: "Susza bywa tu dotkliwa, więc warto mieć zapas wody. W Lublinie awarię wodociągu zgłosisz pod 994."
  storm: "Burze z gradem przychodzą szybko, dlatego ostrzeżenia IMGW warto sprawdzać latem codziennie."
  flood: "Wisła, Bug i Wieprz podtapiają nadrzeczne wsie. Sprawdź swoją okolicę na mapie i ustal, co przeniesiecie wyżej."
  cold: "Zima trzyma tu długo, więc zapas jedzenia i izolacja rur bardzo się przydają."
  power: "Na wsi naprawa linii trwa dłużej, więc zapas wody i latarek ma tu większe znaczenie."
