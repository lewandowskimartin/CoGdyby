name: "Lubelszczyzna"
searchName: "Lubelszczyzna"
answer: "Na Lubelszczyźnie najbardziej dokuczają susza, nawałnice z gradem, wezbrania rzek i długie, mroźne zimy. Poniżej znajdziesz plan dla swojego domu."
description: "Susza, nawałnice, wezbrania Wisły i Bugu oraz mróz na Lubelszczyźnie. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
