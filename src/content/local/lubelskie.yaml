risks:
  - name: "Susza na Lubelszczyźnie"
    rating: "Wysokie"
    atHome: "Rolniczy wschód od lat zmaga się z niedoborem opadów. Wysychają przydomowe studnie, a gminy wprowadzają zakazy podlewania."
    firstAction: "Jeśli korzystasz z własnej studni, trzymaj zapas wody pitnej i sprawdzaj poziom wody w czasie suszy."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Lubelszczyzna"
  - name: "Burze z gradem i trąby powietrzne"
    rating: "Wysokie"
    atHome: "Gwałtowne burze niszczą uprawy, zrywają dachy budynków gospodarczych i linie energetyczne."
    firstAction: "Gdy IMGW ostrzega przed burzami, zamknij zwierzęta w budynkach, schowaj sprzęt z podwórka i naładuj telefony."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Lubelszczyzna"
  - name: "Podtopienia nad Wisłą i Bugiem"
    rating: "Wysokie"
    atHome: "Roztopy i ulewy podnoszą poziom Wisły, Bugu i Wieprza. W 2010 roku prawie cała gmina Wilków znalazła się pod wodą."
    firstAction: "Jeśli mieszkasz blisko rzeki, sprawdź mapę w Hydroportalu ISOK i ustalcie, co przenosicie wyżej w razie alarmu."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Lubelszczyzna"
  - name: "Ostra, kontynentalna zima"
    rating: "Wysokie"
    atHome: "Daleko od morza mróz trzyma długo, a zaspy potrafią odciąć wsie od sklepów."
    firstAction: "Przed zimą zrób zapas jedzenia i leków, a rury w nieogrzewanych pomieszczeniach zaizoluj."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (mróz, śnieg), Lubelszczyzna"
  - name: "Przerwy w prądzie"
    rating: "Średnie"
    atHome: "Na rozległych terenach wiejskich naprawa zerwanej linii trwa zwykle dłużej niż w mieście."
    firstAction: "Na wsi przygotuj się na dłuższą przerwę: latarki, power bank i zapas wody, jeśli pompa przy studni działa na prąd."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, PGE Dystrybucja, Lubelszczyzna"
