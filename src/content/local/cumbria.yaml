draft: true

name: Cumbria

answer: Cumbria's risk register, reviewed in September 2026, rates river flooding and a national power outage as very high risks for the county.
description: What Cumbria's community risk register means for your home, who to call in a flood or power cut, and a 30-minute plan in the right order.

