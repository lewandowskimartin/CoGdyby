    checked: 2026-10-14

register:
  title: Cumbria Community Risk Register (public version)
  edition: Reviewed 28 September 2026
  url: https://cumbriaprepared.org.uk/sites/default/files/13850690/2026-10/Cumbria%20Community%20Risk%20Register%20Public%20Version%20%282%29.pdf
  system: labels
  source:
    url: https://cumbriaprepared.org.uk/sites/default/files/13850690/2026-10/Cumbria%20Community%20Risk%20Register%20Public%20Version%20%282%29.pdf
    quote: Reviewed 28th September 2026
    checked: 2026-10-14

risks:
  - name: River flooding
    rating: Very high
    likelihood: 3
    impact: 4
    atHome: Rivers can rise fast after heavy rain on the fells, and water can reach homes within hours.
    firstAction: Sign up for flood warnings for your postcode.
    source: &register
      url: https://cumbriaprepared.org.uk/sites/default/files/13850690/2026-10/Cumbria%20Community%20Risk%20Register%20Public%20Version%20%282%29.pdf
      quote: Fluvial flooding
      checked: 2026-10-14
  - name: National power outage
    rating: Very high
    likelihood: 3
    impact: 5
    atHome: Lights, heating controls, phones and card payments can all stop at once, possibly for days.
    firstAction: Keep a torch, radio and charged power bank where you can find them in the dark.
    source:
      <<: *register
      quote: National power outage
  - name: Localised surface water flooding
    rating: High
    likelihood: 3
    impact: 3
    atHome: Heavy downpours can overwhelm drains and flood streets and ground floors away from any river.
    firstAction: Know where your stopcock and electricity switch-off are.
    source:
      <<: *register
      quote: Localised Surface Water Flooding
  - name: Low temperatures and snow
    rating: High
    likelihood: 3
    impact: 3
    atHome: Roads close, deliveries stop and older neighbours can be cut off.
    firstAction: Plan one warm room and keep three days of food that needs no cooking.
    source:
      <<: *register
      quote: Low temperatures and snow
  - name: Reservoir or dam collapse
    rating: High
    likelihood: 2
    impact: 4
    atHome: Very unlikely, but homes below a reservoir would have little warning.
    firstAction: Check your address on the long-term flood risk service, which includes reservoirs.
    source:
      <<: *register
      quote: Reservoir/Dam Collapse
  - name: Storms
    rating: Medium
    likelihood: 3
    impact: 2
    atHome: Fallen trees bring down power lines and block roads, especially in rural valleys.
    firstAction: Charge everything and secure loose items when a named storm is forecast.
    source:
      <<: *register
      quote: Storms

