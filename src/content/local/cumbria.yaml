planOrder: [flood, power, cold, evacuation, water]
planNotes:
  flood: Rivers fed by the fells can rise within hours of heavy rain. Add warnings for any river you cross on the school run or the way to work, as well as your own.
  power: SP Electricity North West runs the network here. If anyone at home relies on power for their health, join its free Extra Care register.
  cold: Snow and ice can close fell roads and stop deliveries, so plan for three days without going out.
  evacuation: Pick somewhere on higher ground you could stay, such as friends or family, in case a flood warning tells you to leave.
  water: United Utilities supplies water here. Joining its priority services register also puts you on the electricity network's register.

