name: "Podlasie"
searchName: "Podlasie"
answer: "Podlasie to najzimniejszy region Polski, więc najważniejsze są tu mroźne, śnieżne zimy, a obok nich wichury i przerwy w prądzie. Poniżej opisujemy, co to oznacza dla domu."
description: "Mróz, śnieżyce, wichury, przerwy w prądzie i susza na Podlasiu. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
