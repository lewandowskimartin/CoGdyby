pastEvents:
  - name: "Siarczyste mrozy"
    date: "Zima 2012"
    summary: "Fala arktycznego mrozu przyniosła na Podlasiu temperatury sięgające nawet około -30°C. Zamarzały instalacje, a najbardziej zagrożone były osoby w słabo ogrzanych domach."
    source:
      url: "https://en.wikipedia.org/wiki/Early_2012_European_cold_wave"
      manual: true
      checked: 2026-10-19
      title: "Early 2012 European cold wave (Wikipedia)"
  - name: "Orkany zimowe"
    date: "Luty 2022"
    summary: "Po serii orkanów w całym kraju bez prądu było ponad milion odbiorców. Zerwane linie dotknęły także północny wschód."
    source:
      url: "https://pl.wikipedia.org/wiki/Cyklony_Dudley,_Eunice_i_Franklin"
      manual: true
      checked: 2026-10-19
      title: "Orkany, luty 2022, Podlasie"
