planOrder: [cold, storm, power, water, heat]
planNotes:
  cold: "To najzimniejszy region kraju. Przygotuj dom na tygodnie mrozu: opał, zapasy i zaizolowane rury."
  storm: "Wiatr w puszczy zrywa linie do oddalonych wsi, dlatego ostrzeżenia IMGW warto traktować poważnie."
  power: "Zimą brak prądu oznacza też brak ogrzewania. Trzymaj koce i latarki pod ręką, a awarię zgłoś pod 991."
  water: "W Białymstoku awarię wodociągu zgłosisz pod 994. Latem uważaj z ogniem przy torfowiskach."
  heat: "Nawet krótki upał nagrzewa dom. Wietrz w nocy i pamiętaj o starszych bliskich."
