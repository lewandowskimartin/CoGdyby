risks:
  - name: "Siarczysty mróz"
    rating: "Bardzo wysokie"
    atHome: "Okolice Suwałk nazywa się polskim biegunem zimna. Długie, silne mrozy mogą zamrozić instalację wodną i są groźne dla osób w słabo ogrzanych domach."
    firstAction: "Jesienią zaizoluj rury, zleć przegląd pieca i przygotuj zapas opału oraz leków na najzimniejsze tygodnie."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (mróz), Podlasie"
  - name: "Zamiecie i zaspy"
    rating: "Wysokie"
    atHome: "Obfity śnieg i zamiecie potrafią odciąć wsie nad Biebrzą i Narwią, utrudniając dojazd służb i dostaw."
    firstAction: "Gdy IMGW ostrzega przed zamieciami, odłóż wyjazd i miej w domu zapas jedzenia na kilka dni."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg), Podlasie"
  - name: "Wichury w puszczy"
    rating: "Wysokie"
    atHome: "W rozległych puszczach wiatr łamie drzewa i zrywa linie prowadzące do oddalonych wsi."
    firstAction: "Po ostrzeżeniu IMGW przygotuj latarkę i power bank, a zimą także koce na wypadek wyłączenia prądu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Podlasie"
  - name: "Susza"
    rating: "Średnie"
    atHome: "Gdy długo nie pada, spada poziom Biebrzy i Narwi, a wysuszone torfowiska łatwo się zapalają."
    firstAction: "W czasie suszy oszczędzaj wodę i nie rozpalaj ognia w pobliżu łąk i torfowisk."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Podlasie"
  - name: "Upały"
    rating: "Średnie"
    atHome: "Upały są tu krótsze, ale potrafią mocno nagrzać domy. Najtrudniej znoszą je osoby starsze."
    firstAction: "W upał wietrz w nocy, zasłaniaj okna w dzień i przypominaj starszym bliskim o piciu wody."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Podlasie"
