risks:
  - name: "Mroźne, śnieżne zimy"
    rating: "Wysokie"
    atHome: "Zima na pojezierzu jest długa, a zaspy potrafią na kilka dni odciąć wsie w okolicach Puszczy Piskiej."
    firstAction: "Opał, jedzenie i leki zgromadź jesienią, a rury w nieogrzewanych pomieszczeniach zaizoluj przed mrozem."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Warmia i Mazury"
  - name: "Wichury i nawałnice"
    rating: "Wysokie"
    atHome: "Nawałnice z sierpnia 2017 roku połamały duże obszary lasów, a silny wiatr wciąż zrywa linie prowadzące do leśnych osad."
    firstAction: "Latem, zwłaszcza na wakacjach nad jeziorem, sprawdzaj ostrzeżenia IMGW i nie zostawajcie w lesie ani na wodzie, gdy nadchodzi burza."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Warmia i Mazury"
  - name: "Długie przerwy w prądzie"
    rating: "Wysokie"
    atHome: "Domy są tu rozrzucone wśród lasów i jezior, więc naprawa zerwanej linii często trwa długo."
    firstAction: "Latarkę, power bank i radio trzymaj w jednym miejscu. Awarię zgłosisz pod numerem 991, a jej zasięg sprawdzisz u Energi Operator."
    source:
      url: "https://energa-operator.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Energa Operator, Warmia i Mazury"
  - name: "Susza i niskie stany jezior"
    rating: "Średnie"
    atHome: "Gdy długo nie pada, spada poziom jezior i wód gruntowych, a niektóre gminy ograniczają pobór wody."
    firstAction: "Latem podlewaj ogród deszczówką i trzymaj w domu kilka zgrzewek wody pitnej."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Warmia i Mazury"
  - name: "Podtopienia"
    rating: "Średnie"
    atHome: "Roztopy i ulewy podnoszą poziom rzek i jezior, a woda zalewa nisko położone działki."
    firstAction: "Po długich opadach sprawdzaj, czy woda nie podchodzi pod dom. Gmina zwykle wydaje worki z piaskiem."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Warmia i Mazury"
