planOrder: [cold, storm, power, water, flood]
planNotes:
  cold: "Zimą wsie na pojezierzu bywają odcięte przez kilka dni, więc opał, zapasy i izolację rur przygotuj jesienią."
  storm: "Letnie burze potrafią łamać całe połacie lasu. Ostrzeżeń IMGW nie warto lekceważyć, zwłaszcza na wakacjach."
  power: "Wśród lasów i jezior naprawa linii trwa długo. Awarię zgłosisz pod 991."
  water: "W Olsztynie awarię wodociągu zgłosisz pod 994."
  flood: "Po roztopach woda podchodzi pod nisko położone domy. Ustal, co przeniesiecie wyżej, i gdzie gmina wydaje worki z piaskiem."
