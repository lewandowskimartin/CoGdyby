    date: June 2019
    summary: The bank of the Steeping River relief channel breached on 12 June, and 580 homes were evacuated over six days, affecting around 1,000 people.
    source:
      url: https://www.lincolnshire.gov.uk/downloads/file/3483/wainfleet-flood-investigation-report
      quote: ['breach in the bank of the relief channel on 12th June', '580 homes were evacuated over 6 days']
      checked: 2026-10-15
  - name: Storm Babet
    date: October 2023
    summary: Almost 700 properties across Lincolnshire flooded inside.
    source:
      url: https://www.lincolnshire.gov.uk/news/article/1699/extra-4m-allocated-for-flood-investigations-and-alleviation
      quote: Almost 700 properties were internally flooded across Lincolnshire
      checked: 2026-10-15

