planOrder: [flood, evacuation, power, cold, water]
planNotes:
  flood: In 2019 Wainfleet's relief channel breached and 580 homes were evacuated. On the coast and the fens, plan a way out that doesn't rely on roads that flood.
  evacuation: Of the risks here, coastal flooding is the one most likely to mean leaving home. Through the winter surge season, keep the grab bag by the door and agree where you'd stay inland.
  power: National Grid Electricity Distribution runs most of the network here. Join its free Priority Services Register if anyone at home relies on electricity for their health.
  cold: Gritters cover main routes first, so fen and Wolds villages can wait. Plan for a few days without driving.
  water: Anglian Water supplies the county. Its priority services register is free and arranges bottled water when supplies stop.

