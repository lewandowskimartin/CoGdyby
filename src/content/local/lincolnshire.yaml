# Lincolnshire: facts and copy for /local/lincolnshire/ (template: src/pages/local/[area].astro).
# Every `source` holds the exact words on its page; `npm run check:sources -- --area lincolnshire`
# confirms they're still there.
# The Lincolnshire Resilience Forum publishes no current Community Risk Register, only an unrated
# list of risks (its /risks/ page). The "High" ratings for flooding come from the fire service's
# Community Risk Profile, which quotes the forum's register. The watch below flags a register PDF
# the day one appears. TODO(Martin): email the forum (lincsep@lincolnshire.gov.uk) for the current register.
# North Lincolnshire and North East Lincolnshire are in the Humber LRF, not this one.

draft: true

name: Lincolnshire

answer: Lincolnshire's resilience forum lists coastal flooding first among its local risks, and about 220,000 people in the county live in the coastal zone.
description: What Lincolnshire's local risks mean for your home, from coastal and river flooding to power cuts, who to call and a 30-minute plan.

lrf:
  name: Lincolnshire Resilience Forum
  url: https://www.lincolnshireresilienceforum.org/
  source:
    url: https://www.lincolnshireresilienceforum.org/contact-us/
    quote: Emergency Planning team
    checked: 2026-10-15

register:
  title: Lincolnshire Resilience Forum list of local risks
  edition: No ratings published; list updated 2026
  url: https://www.lincolnshireresilienceforum.org/risks/
  system: unrated
  source: &risks
    url: https://www.lincolnshireresilienceforum.org/risks/
    quote: Coastal Flooding
    checked: 2026-10-15

risks:
  - name: Coastal flooding
    rating: High
    atHome: About 220,000 people live in the coastal zone, where a North Sea surge can flood homes and force whole streets to leave.
    firstAction: Sign up for flood warnings and agree now where you would go if told to leave.
    source: &profile
      url: https://www.lincolnshire.gov.uk/downloads/file/4817/lfr-community-risk-profile
      title: Lincolnshire Fire and Rescue community risk profile
      quote: ['220,000 people live in Lincolnshire', 'considered a high risk in the LRF community risk register']
      checked: 2026-10-15
  - name: River and surface water flooding
    rating: High
    atHome: Inland, rivers and drains can overflow after a single day of heavy rain, as Storm Babet showed.
    firstAction: Check your address on the long-term flood risk map, which covers rivers and surface water.
    source:
      <<: *profile
      quote: Flooding and severe weather is considered a high risk
  - name: Loss of gas or electricity
    rating: Listed
    atHome: Heating, cooking and phones can all stop, and rural homes can be off for longer.
    firstAction: Keep a torch, a battery radio and a charged power bank together.
    source:
      <<: *risks
      quote: Loss of Gas or Electricity
  - name: Extreme cold weather
    rating: Listed
    atHome: Fen and Wolds roads can ice over, cutting off villages from shops and care visits.
    firstAction: Plan one warm room and keep three days of food that needs no cooking.
    source:
      <<: *risks
      quote: Extreme Cold Weather
  - name: Heatwave
    rating: Listed
    atHome: Older people living alone are most at risk when nights stay warm.
    firstAction: Agree who checks on whom in your family or street during a heatwave.
    source:
      <<: *risks
      quote: Heatwave

