risks:
  - name: "Powódź górska na Wiśle i Dunajcu"
    rating: "Bardzo wysokie"
    atHome: "Dunajec, Raba, Skawa i górna Wisła potrafią wezbrać w kilka godzin po ulewie. W 1997 i 2010 roku woda zagroziła Krakowowi i zalała podgórskie gminy."
    firstAction: "Sprawdzaj stany wód na stronie IMGW i miej gotowy plan, jak przenieść dokumenty i sprzęt na piętro."
    source:
      url: "https://isok.gov.pl/hydroportal.html"
      manual: true
      checked: 2026-10-19
      title: "Mapy zagrożenia powodziowego (ISOK), Małopolska"
  - name: "Wiatr halny"
    rating: "Wysokie"
    atHome: "Na Podhalu halny w porywach przekracza nawet 100 km/h. Potrafi zrywać dachy, łamać drzewa i zwiększać ryzyko pożaru."
    firstAction: "Gdy zapowiadają halny, sprawdź mocowanie blach i obróbek na dachu, schowaj rzeczy z podwórka i przygotuj się na przerwę w prądzie."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr halny), Małopolska"
  - name: "Osuwiska karpackie"
    rating: "Wysokie"
    atHome: "Po długich deszczach nasiąknięte wodą stoki Beskidów mogą się osuwać i niszczyć domy oraz drogi dojazdowe."
    firstAction: "Po ulewach zwracaj uwagę na nowe pęknięcia ścian i przechylające się płoty lub drzewa. Jeśli je zauważysz, zgłoś to w gminie lub pod 112."
    source:
      url: "https://www.gov.pl/web/rcb"
      manual: true
      checked: 2026-10-19
      title: "Osuwiska, komunikaty RCB, Małopolska"
  - name: "Śnieżyce i mróz w górach"
    rating: "Wysokie"
    atHome: "Obfity śnieg potrafi odciąć górskie wsie od Nowego Targu po Beskid Sądecki, a mróz utrudnia ogrzanie drewnianych domów."
    firstAction: "Przed zimą zrób zapas opału, jedzenia i leków na dni, gdy droga do miasta jest nieprzejezdna."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), Małopolska"
  - name: "Przerwy w prądzie"
    rating: "Średnie"
    atHome: "Po halnym i śnieżycach górskie gminy mogą długo czekać na prąd, a często znika też zasięg telefonu."
    firstAction: "Pilnuj, żeby power bank był naładowany, i trzymaj w domu radio na baterie. Awarię zgłosisz pod 991."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie i wyłączenia, Tauron, Małopolska"
