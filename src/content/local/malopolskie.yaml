pastEvents:
  - name: "Powódź nad Wisłą"
    date: "Maj 2010"
    summary: "Ulewy w Karpatach podniosły poziom Wisły i jej dopływów. W Krakowie ogłoszono alarm powodziowy, a wiele miejscowości w regionie zostało zalanych."
    source:
      url: "https://pl.wikipedia.org/wiki/Pow%C3%B3d%C5%BA_w_Polsce_(2010)"
      manual: true
      checked: 2026-10-19
      title: "Powódź w Polsce (2010), Małopolska"
  - name: "Powódź tysiąclecia"
    date: "Lipiec 1997"
    summary: "Katastrofalna powódź dotknęła także Małopolskę, m.in. okolice Oświęcimia i tereny nad górną Wisłą. Wielu mieszkańców zostało bez prądu i wody."
    source:
