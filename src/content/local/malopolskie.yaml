planOrder: [flood, storm, power, cold, water]
planNotes:
  flood: "Górskie rzeki wzbierają w kilka godzin. Sprawdzaj stan Dunajca i Raby i ustal, co przeniesiecie na piętro."
  storm: "Halny bywa silniejszy niż wichury na nizinach, więc gdy go zapowiadają, sprawdź dach i podwórko."
  power: "W górach przerwy trwają dłużej i często znika też zasięg. Awarię zgłosisz pod 991."
  cold: "Śnieg potrafi odciąć górskie wsie, dlatego zapas opału, jedzenia i leków warto zrobić jesienią."
  water: "Awarię wodociągu w Krakowie zgłosisz pod 994. W czasie suszy gminy mogą ograniczać pobór wody."
