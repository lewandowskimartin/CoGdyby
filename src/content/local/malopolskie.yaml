name: "Małopolska"
searchName: "Małopolska"
answer: "W Małopolsce najgroźniejsze są gwałtowne powodzie na górskich rzekach, osuwiska, wiatr halny i śnieżyce. Sprawdź, jak krok po kroku przygotować dom."
description: "Powodzie na górskich rzekach, osuwiska, halny i śnieżyce w Małopolsce. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
