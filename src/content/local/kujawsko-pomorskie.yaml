planOrder: [storm, power, water, cold, heat]
planNotes:
  storm: "Nawałnice takie jak w 2017 roku są tu największym zagrożeniem, dlatego letnich ostrzeżeń IMGW nie warto lekceważyć."
  power: "Po nawałnicy w gminach leśnych prąd może wracać kilka dni. Awarię zgłosisz pod 991."
  water: "Latem Kujawy bywają suche. Awarię wodociągu w Bydgoszczy zgłosisz pod 994."
  cold: "Przed zimą zaizoluj rury w garażu lub piwnicy i zrób zapas na czas oblodzonych dróg."
  heat: "W upał najbardziej nagrzewają się mieszkania pod dachem. Pamiętaj też o starszych sąsiadach."
