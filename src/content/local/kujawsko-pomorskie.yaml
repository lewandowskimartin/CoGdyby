pastEvents:
  - name: "Nawałnice stulecia"
    date: "Sierpień 2017"
    summary: "Gwałtowne burze i trąby powietrzne zniszczyły lasy w Borach Tucholskich i okolicach. Dziesiątki tysięcy odbiorców zostały bez prądu, niektórzy na wiele dni."
    source:
      url: "https://pl.wikipedia.org/wiki/Nawa%C5%82nice_w_Polsce_(2017)"
      manual: true
      checked: 2026-10-19
      title: "Nawałnice w Polsce (2017), Kujawy i Pomorze"
  - name: "Orkany zimowe"
    date: "Luty 2022"
    summary: "Seria orkanów, m.in. Dudley i Eunice, zerwała linie energetyczne w wielu regionach. W całym kraju bez prądu było ponad milion odbiorców, również w kujawsko-pomorskim."
    source:
      url: "https://pl.wikipedia.org/wiki/Cyklony_Dudley,_Eunice_i_Franklin"
      manual: true
      checked: 2026-10-19
      title: "Orkany, luty 2022, Kujawy i Pomorze"
