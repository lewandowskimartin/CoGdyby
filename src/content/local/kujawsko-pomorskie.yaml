risks:
  - name: "Nawałnice i trąby powietrzne"
    rating: "Bardzo wysokie"
    atHome: "W sierpniu 2017 roku nawałnica w kilkanaście minut powaliła tysiące hektarów lasu w Borach Tucholskich. Podobne burze wciąż zrywają tu dachy i linie energetyczne."
    firstAction: "Latem sprawdzaj ostrzeżenia IMGW przed wyjazdem nad jezioro lub do lasu i ustal, gdzie schronicie się w czasie burzy."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Kujawy i Pomorze"
  - name: "Wichury nad doliną Wisły"
    rating: "Wysokie"
    atHome: "Wiatr wiejący doliną Wisły między Bydgoszczą a Toruniem przewraca drzewa i zrywa napowietrzne linie na wsiach."
    firstAction: "Po ostrzeżeniu zabezpiecz podwórko i balkon, a telefony i power banki naładuj jeszcze przed wieczorem."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Kujawy i Pomorze"
  - name: "Przerwy w prądzie"
    rating: "Wysokie"
    atHome: "Po dużej nawałnicy w leśnych gminach prąd potrafi wracać nawet kilka dni."
    firstAction: "Trzymaj latarkę, power bank i radio razem. Awarię zgłosisz pod numerem 991, a jej zasięg sprawdzisz na stronie Energi Operator."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Energa Operator, Kujawy i Pomorze"
  - name: "Susza"
    rating: "Średnie"
    atHome: "Kujawy należą do najsuchszych części kraju. Przy niskich opadach spada poziom wód, a gminy apelują o oszczędzanie wody."
    firstAction: "W czasie suszy podlewaj ogród wieczorem lub deszczówką i trzymaj w domu zapas wody do picia."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Kujawy i Pomorze"
  - name: "Upały"
    rating: "Średnie"
    atHome: "Fale upałów nagrzewają mieszkania w Bydgoszczy i Toruniu, szczególnie na ostatnich piętrach. Najtrudniej znoszą to seniorzy i małe dzieci."
    firstAction: "W upalne dni zasłaniaj okna od strony słońca, pamiętaj o piciu wody i zaglądaj do starszych sąsiadów."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Kujawy i Pomorze"
