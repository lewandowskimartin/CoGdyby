name: "Kujawsko-Pomorskie"
searchName: "Kujawsko-Pomorskie"
answer: "W kujawsko-pomorskim najgroźniejsze bywają letnie nawałnice i trąby powietrzne, a po nich wichury i przerwy w prądzie. Oto praktyczny plan dla Twojego domu."
description: "Nawałnice, wichury, przerwy w prądzie i susza w kujawsko-pomorskim. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
