name: "Łódzkie"
searchName: "Łódzkie"
answer: "W łódzkim najbardziej dokuczają susza, upały w mieście oraz orkany i wichury. Dom przygotujesz w kilku krokach opisanych niżej."
description: "Susza, upały, orkany i przerwy w prądzie w województwie łódzkim. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
