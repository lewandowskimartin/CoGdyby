risks:
  - name: "Pogłębiająca się susza"
    rating: "Bardzo wysokie"
    atHome: "Łódzkie to jeden z najsuchszych regionów Polski. Latem w Bzurze i Pilicy ubywa wody, a niektóre gminy zakazują podlewania."
    firstAction: "W czasie suszy oszczędzaj wodę z kranu i trzymaj zapas wody pitnej na kilka dni."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, region łódzki"
  - name: "Upał w Łodzi"
    rating: "Wysokie"
    atHome: "Gęsta zabudowa łódzkiego śródmieścia nie stygnie w nocy. Długie upały są szczególnie trudne dla seniorów w kamienicach bez klimatyzacji."
    firstAction: "W upał zasłaniaj okna w ciągu dnia, wietrz nocą i zaglądaj do starszych sąsiadów, którzy mieszkają sami."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), region łódzki"
  - name: "Orkany i nawałnice"
    rating: "Wysokie"
    atHome: "Zimowe orkany, takie jak Dudley i Eunice w 2022 roku, oraz letnie burze zrywają linie w całym regionie."
    firstAction: "Przy ostrzeżeniu IMGW zabezpiecz balkon, naładuj telefony i połóż latarkę w widocznym miejscu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), region łódzki"
  - name: "Przerwy w prądzie"
    rating: "Średnie"
    atHome: "Prąd znika najczęściej po wichurze, a czasem także w upał, gdy sieć jest mocniej obciążona."
    firstAction: "Przed zapowiadanym upałem lub wichurą naładuj power bank i połóż go obok radia na baterie."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, PGE Dystrybucja, region łódzki"
  - name: "Mróz i śnieżyce"
    rating: "Średnie"
    atHome: "Oblodzone drogi i zaspy utrudniają dojazd, a w starszych budynkach mróz mocno obciąża ogrzewanie."
    firstAction: "Przed zimą sprawdź izolację rur i odłóż zapas jedzenia na dni, gdy trudno dojechać do sklepu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (śnieg, mróz), region łódzki"
