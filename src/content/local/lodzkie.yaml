planOrder: [water, heat, storm, power, cold]
planNotes:
  water: "W tak suchym regionie zapas wody ma szczególne znaczenie. W Łodzi awarię wodociągu zgłosisz pod 994."
  heat: "Śródmieście Łodzi nie stygnie nocą, więc w upał dzwoń do starszych bliskich i sąsiadów."
  storm: "Orkany zimą i burze latem zrywają linie, dlatego warto reagować na ostrzeżenia IMGW."
  power: "W upalne dni sieć bywa dodatkowo obciążona, więc przerwy zdarzają się też latem."
  cold: "Zadbaj o izolację rur i zrób zapas na czas zasypanych dróg."
