planOrder: [water, storm, heat, power, cold]
planNotes:
  water: "W tak suchym regionie warto zbierać deszczówkę i mieć zapas wody. W Poznaniu awarię zgłosisz pod 994."
  storm: "Nawałnice łamią lasy i zrywają linie, więc letnie ostrzeżenia IMGW warto traktować poważnie."
  heat: "Latem mieszkania mocno się nagrzewają. Pamiętaj o starszych bliskich i o piciu wody."
  power: "Po wichurze wiejskie gminy mogą długo czekać na prąd."
  cold: "Przed zimą zaizoluj rury i przygotuj zapas na dni z gołoledzią."
