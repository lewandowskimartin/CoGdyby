risks:
  - name: "Chroniczny deficyt wody"
    rating: "Bardzo wysokie"
    atHome: "W Warcie i Noteci latem bywa bardzo mało wody, a w niektórych gminach wysychają przydomowe studnie."
    firstAction: "Zbieraj deszczówkę do podlewania ogrodu, a w domu trzymaj kilka zgrzewek wody do picia."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Monitoring suszy IMGW, Wielkopolska"
  - name: "Nawałnice i trąby powietrzne"
    rating: "Wysokie"
    atHome: "Gwałtowne burze, takie jak w 2017 roku, łamią lasy i drzewa w miastach oraz zrywają linie na wsiach."
    firstAction: "Gdy IMGW ostrzega przed burzą, wstaw samochód do garażu, naładuj telefony i przeczekaj burzę w domu."
    source:
      url: "https://hydro.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia meteorologiczne IMGW, Wielkopolska"
  - name: "Upały"
    rating: "Wysokie"
    atHome: "Latem region mocno się nagrzewa. Długie upały męczą zwłaszcza seniorów i rodziny z małymi dziećmi w poznańskich blokach."
    firstAction: "Na noc przenieście dzieci do najchłodniejszego pokoju i dzwońcie codziennie do starszych bliskich."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (upały), Wielkopolska"
  - name: "Wichury"
    rating: "Wysokie"
    atHome: "Na otwartych polach wiatr szybko się rozpędza, przewraca drzewa przy drogach i zrywa napowietrzne linie."
    firstAction: "Po ostrzeżeniu IMGW zabezpiecz podwórko i przygotuj latarki na wieczór bez prądu."
    source:
      url: "https://meteo.imgw.pl/"
      manual: true
      checked: 2026-10-19
      title: "Ostrzeżenia IMGW (wiatr), Wielkopolska"
  - name: "Przerwy w prądzie"
    rating: "Średnie"
    atHome: "Na wsiach prąd znika najczęściej wtedy, gdy wichura przewróci drzewo na linię."
    firstAction: "W czasie przerwy nie otwieraj zamrażarki. Pełna utrzyma chłód nawet do dwóch dób."
    source:
      url: "https://www.operator.enea.pl/"
      manual: true
      checked: 2026-10-19
      title: "Awarie, Enea Operator, Wielkopolska"
