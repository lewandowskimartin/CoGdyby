name: "Wielkopolska"
searchName: "Wielkopolska"
answer: "W Wielkopolsce od lat brakuje wody, więc najważniejsza jest tu susza, a obok niej nawałnice, wichury i upały. Poniżej opisujemy, co to oznacza dla domu."
description: "Susza, nawałnice, wichury, upały i przerwy w prądzie w Wielkopolsce. Operatorzy, numery alarmowe i plan na 30 minut dla domu."
