# Checks on every push. Cloudflare still does the real deploy build; this run only reports.
#   1. Unit tests (quiz, kit, source checker)
#   2. Build: the content schema fails it if a local-guide fact has no source and quote
#   3. Duplicate text across /local/ pages (doorway guardrail, 30% limit)
#   4. Internal links in the built site (offline, so a slow outside site never fails a push;
#      outside links are checked weekly by watch-sources.yml)
# Plan: plans/2026-10-14-local-pages-automation.md

name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Duplicate text across local pages
        run: npm run check:similarity

      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/dist
            --index-files index.html
            'dist/**/*.html'
          fail: true
